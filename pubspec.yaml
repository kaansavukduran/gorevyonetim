name: gunluk_gorevler
description: "Günlük Görevler: her gün tik atılan görev listesi"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.5

# Only SDK packages: no third-party code runs in this app.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled, offline fonts (SIL Open Font License 1.1; licences beside the
  # files). All three cover the Turkish letters ÇĞİÖŞÜ çğıöşü.
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonNext.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
