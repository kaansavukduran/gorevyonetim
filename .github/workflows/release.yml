name: release

# Tests four platforms, checks desktop startup and Android storage on an emulator.
# Only a successful main build publishes a new numbered prerelease.
# Desktop packages are unsigned; the Android preview uses a debug signing key.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.47.6"
  APP_VERSION: "1.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Test on Windows
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build
        shell: bash
        run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}+${{ github.run_number }}
      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/windows/x64/runner/Release dist/Gunluk-Gorevler -Recurse
          Set-Content -Encoding utf8 dist/Gunluk-Gorevler/OKU-BENI.txt "gunluk_gorevler.exe dosyasina cift tikla. Gorevler %APPDATA%\GunlukGorevler\gorevler.json dosyasinda saklanir; bu klasoru silmek gorevleri silmez."
          Compress-Archive -Path dist/Gunluk-Gorevler -DestinationPath dist/Gunluk-Gorevler-Windows-portable.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.APP_VERSION }} packaging/gunluk_gorevler.iss
      - name: Check the executable starts and writes nothing before a change
        shell: pwsh
        run: |
          $env:GUNLUK_GOREVLER_DIR = "$env:RUNNER_TEMP\gg-start-check"
          $p = Start-Process -FilePath "build/windows/x64/runner/Release/gunluk_gorevler.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "gunluk_gorevler.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (Test-Path "$env:GUNLUK_GOREVLER_DIR\gorevler.json") { throw "a data file was written without any change" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Gunluk-Gorevler-Windows-Kurulum.exe
            dist/Gunluk-Gorevler-Windows-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Test on macOS
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build
        run: flutter build macos --release --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}+${{ github.run_number }}
      - name: Check the app starts and writes nothing before a change
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          echo "$APP"
          lipo -info "$APP/Contents/MacOS/"*
          "$APP/Contents/MacOS/Gunluk Gorevler" &
          PID=$!
          sleep 10
          kill -0 $PID || { echo "the app exited early"; exit 1; }
          kill $PID
          if find "$HOME/Library/Containers/com.gunlukgorevler.gunlukGorevler" -name gorevler.json 2>/dev/null | grep -q .; then
            echo "a data file was written without any change"; exit 1
          fi
      - name: DMG and ZIP
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Gunluk Gorevler" -srcfolder dist/dmg -ov -format UDZO dist/Gunluk-Gorevler-macOS.dmg
          ditto -c -k --keepParent "$APP" dist/Gunluk-Gorevler-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Gunluk-Gorevler-macOS.dmg
            dist/Gunluk-Gorevler-macOS.zip
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 keeps the glibc floor low (Ubuntu 22.04+, Debian 12+, Fedora 36+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev xvfb xdotool imagemagick
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Test on Linux
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          xvfb-run -a flutter test integration_test -d linux
      - name: Build
        run: flutter build linux --release --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}+${{ github.run_number }}
      - name: Mouse and keyboard smoke (first start writes nothing, add, tick, restart)
        run: xvfb-run -a -s "-screen 0 1180x800x24" tool/linux_smoke.sh "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screens
          path: ${{ runner.temp }}/smoke
      - name: Package
        run: tool/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Gunluk-Gorevler-linux-x64.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Test shared application code
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device storage and task round trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
      - name: Build preview APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}+${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Gunluk-Gorevler-Android-onizleme.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Gunluk-Gorevler-Android-onizleme.apk
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, macos, linux, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{windows,macos,linux,android}"
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          Arayüz ölçeği (%80–%200), telefon ekranına uyarlanan görev kartları, Android cihaz içi kayıt ve dosya seçicisiyle yedekleme. Karakter sınıfı ve hızlı ayar değişikliklerinin kalıcı kaydı düzeltildi.

          **Windows:** `Gunluk-Gorevler-Windows-Kurulum.exe` kurar (Başlat menüsü, isteğe bağlı masaüstü kısayolu). Kurulumsuz: `Gunluk-Gorevler-Windows-portable.zip` aç, `gunluk_gorevler.exe`. SmartScreen uyarırsa: Ek bilgi → Yine de çalıştır.

          **macOS:** `Gunluk-Gorevler-macOS.dmg` aç, uygulamayı Applications klasörüne sürükle. İmzasız olduğu için ilk açılışta uygulamaya sağ tık → Aç → Aç. Açılmazsa Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç".

          **Linux (x64):** `Gunluk-Gorevler-linux-x64.tar.gz` aç; `./bundle/gunluk_gorevler` ile çalıştır ya da `./install.sh` ile uygulama menüsüne kur. GTK 3 gerekir.

          **Android (önizleme):** `Gunluk-Gorevler-Android-onizleme.apk`. APK test anahtarıyla imzalanır; mağaza sürümü değildir ve sonraki önizlemeler aynı anahtarı kullanmayabilir. Kaldırmadan önce yedeği dışa aktar; uygulamayı kaldırmak cihaz içindeki görevleri siler. Kalıcı dağıtım anahtarı henüz yapılandırılmadı. Yedek alırken ve yüklerken Android dosya seçicisi açılır. Uygulama kapalıyken hatırlatma gönderilmez.

          Görevler cihazında saklanır. Masaüstü paketleri kod imzası içermez. Android APK test imzalıdır. SHA-256 değerleri `SHA256SUMS.txt` içinde.

          Bu paketler aynı commit'ten, dört platformun kontrolleri başarılı olduktan sonra yayımlanır. Android emülatör testi cihaz içi veri ve yeniden açılış kontrolünü kapsar; yerel dosya seçicisi elle cihaz kontrolü bekliyor.
          NOTES
      - name: Publish the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ env.APP_VERSION }}-build.${{ github.run_number }}"
          gh release create "$TAG" dist/* --prerelease --target "${{ github.sha }}" \
            --title "Günlük Görevler ${{ env.APP_VERSION }}.${{ github.run_number }} (Windows, macOS, Linux, Android)" --notes-file notes.md
